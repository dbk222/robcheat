<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Dashboard — ROB CHEAT</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#08060d;--panel:#120d1b;--line:#30233d;--txt:#f7f1ff;--muted:#a99db8;--pink:#ff4fb8;--purple:#df32ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#32113d,#08060d 55%);color:var(--txt);font:14px Inter,Arial;padding:28px}.wrap{max-width:1100px;margin:auto}.brand{font:700 30px Oswald;letter-spacing:1.5px;color:white;text-decoration:none}.brand span{color:#ef42ce}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.btn{border:1px solid #493253;background:#100b17;color:#e7d7f4;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.btn.primary{border:0;background:linear-gradient(110deg,#d52cff,#f34abf);color:white}.hero{border:1px solid var(--line);border-radius:16px;padding:28px;background:linear-gradient(145deg,#15101e,#0d0a13);margin-bottom:20px}.kicker{letter-spacing:4px;font-size:10px;color:#d9b9f4;font-weight:800}.hero h1{font:600 38px Oswald;margin:10px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.panel{border:1px solid var(--line);border-radius:13px;padding:20px;background:#110d18}.panel h3{margin:0 0 16px;font:600 20px Oswald}.stat{font:600 27px Oswald;margin-top:8px}.wide{grid-column:1/-1}.license{border:1px solid #42284d;border-radius:10px;padding:16px;margin:10px 0;background:#0b0811}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill{font-size:11px;padding:5px 9px;border-radius:99px;background:#183923;color:#a6f0bb}.pill.warn{background:#392915;color:#ffdb9a}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #44314f;border-radius:10px}.foot{margin:25px 0;text-align:center;color:#82748e;font-size:12px}#notice{margin:12px 0;color:#ffb6c8}@media(max-width:700px){body{padding:16px}.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="index.html">ROB <span>CHEAT</span></a><div><span id="user" class="muted"></span> <button class="btn" id="logout">Sign out</button></div></header>
<section class="hero"><div class="kicker">MEMBER AREA</div><h1>Dashboard</h1><div class="muted">Manage your ROB CHEAT account, licenses and devices.</div><div id="notice"></div></section>
<div class="grid"><section class="panel"><div class="muted">Active licenses</div><div class="stat" id="activeCount">—</div></section><section class="panel"><div class="muted">Registered devices</div><div class="stat" id="deviceCount">—</div></section><section class="panel"><div class="muted">Account status</div><div class="stat" style="font-size:22px;color:#a6f0bb">Verified session</div></section>
<section class="panel wide"><div class="row"><h3>Your licenses</h3><button class="btn" id="refresh">Refresh</button></div><div id="licenses"><div class="empty">Loading your licenses…</div></div></section>
<section class="panel wide"><h3>Recent activity</h3><div id="activity"><div class="empty">Loading activity…</div></div></section>
<section class="panel wide"><h3>Account</h3><div class="row"><div><div id="email"></div><div class="muted" id="created"></div></div><button class="btn" onclick="location.href='account.html'">Account settings</button></div></section></div>
<div class="foot">ROB CHEAT · Member Dashboard</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://rzbvtzeqrcfutfafaamm.supabase.co','sb_publishable_C1Mv75fwRb3bA9gx6JqN7w_2c2CyJvF');
let session,user;
const fmt=d=>d?new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'No expiry';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const r=await sb.auth.getSession();session=r.data.session;if(!session){location.href='account.html?next=dashboard.html';return}user=session.user;document.getElementById('user').textContent=user.user_metadata?.username||user.user_metadata?.display_name||user.email;document.getElementById('email').textContent=user.email;document.getElementById('created').textContent='Joined '+fmt(user.created_at);await load()}
async function load(){const lic=document.getElementById('licenses'),act=document.getElementById('activity');lic.innerHTML='<div class="empty">Loading…</div>';act.innerHTML='<div class="empty">Loading…</div>';
const {data:ls,error}=await sb.from('licenses').select('id,key_prefix,product_code,plan,status,expires_at,max_devices,created_at').eq('owner_id',user.id).order('created_at',{ascending:false});
if(error){lic.innerHTML='<div class="empty">Could not load licenses. '+esc(error.message)+'</div>';document.getElementById('activeCount').textContent='—';}else{const active=(ls||[]).filter(x=>x.status==='active'&&(!x.expires_at||new Date(x.expires_at)>new Date()));document.getElementById('activeCount').textContent=active.length;const ids=(ls||[]).map(x=>x.id);let devices=[];if(ids.length){const d=await sb.from('hwid_devices').select('id,license_id,device_label,first_seen_at,last_seen_at,revoked_at').in('license_id',ids);devices=d.data||[]}document.getElementById('deviceCount').textContent=devices.filter(x=>!x.revoked_at).length;
if(!ls?.length)lic.innerHTML='<div class="empty">No licenses assigned yet. Once your purchase is approved, your license will appear here.</div>';else lic.innerHTML=ls.map(x=>'<div class="license"><div class="row"><strong>'+esc(x.product_code||'ROB CHEAT')+' · '+esc(x.plan||'License')+'</strong><span class="pill '+(x.status==='active'?'':'warn')+'">'+esc(x.status)+'</span></div><p class="muted">Key: '+esc(x.key_prefix||'••••••••')+' · Expires: '+fmt(x.expires_at)+'</p><div class="muted">Devices: '+devices.filter(d=>d.license_id===x.id&&!d.revoked_at).length+' / '+x.max_devices+'</div></div>').join('')}
const a=await sb.from('license_activations').select('event,created_at,metadata').eq('user_id',user.id).order('created_at',{ascending:false}).limit(8);if(a.error)act.innerHTML='<div class="empty">Activity unavailable.</div>';else if(!a.data?.length)act.innerHTML='<div class="empty">No activation activity yet.</div>';else act.innerHTML=a.data.map(x=>'<div class="license row"><span>'+esc(x.event)+'</span><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span></div>').join('')}
document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='account.html'};sb.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT')location.href='account.html'});init();
</script></body></html>
